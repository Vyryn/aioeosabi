[tool.poetry]
name = "aioeosabi"
version = "0.1.3"
description = "Async library for interacting with EOS.io blockchain"
authors = ["MajicGit"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Vyryn/aioeosABI"
documentation = "https://aioeos.readthedocs.io/en/latest/"
keywords = ["blockchain", "eos", "async", "eosio", "cryptocurrency"]

[tool.poetry.dependencies]
python = ">=3.10,<4"
aiohttp = ">=3.14.5,<4"
base58 = ">=2.1.1,<3"
wallycore = ">=1.5.6,<2"
antelopy = "^0.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10"
pytest-cov = ">=7.1.0,<8"
cryptography = ">=50.0.2,<51"

[build-system]
requires = ["poetry-core>=2.2.1,<3"]
build-backend = "poetry.core.masonry.api"
